name: Dependency Updates

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at 12 PM
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check & Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Update requirements
        run: |
          pip-compile --upgrade requirements.in -o requirements.txt

      - name: Check if requirements changed
        id: changed
        run: |
          if git diff --exit-code requirements.txt; then
            echo "No changes to requirements"
          else
            echo "Requirements changed"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for dependency update
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: 'Update dependencies'
          body: |
            This PR updates the project dependencies.

            ## Changes
            - Updated requirements.txt with latest compatible versions

            ## Verification
            - [ ] Tests pass
            - [ ] No breaking changes
          branch: 'deps/update-dependencies'
          base: 'main'